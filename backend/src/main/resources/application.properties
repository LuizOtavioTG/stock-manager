spring.application.name=stock-manager

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/stock_manager
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=none

spring.messages.basename=messages/validation-messages-category,messages/validation-messages-inventory,messages/validation-messages-product,messages/validation-messages-stockMovement



spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.open-in-view=true

app.security.jwt.secret=${JWT_SECRET:stock-manager-development-secret-key-32}
app.security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
app.security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}

server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
