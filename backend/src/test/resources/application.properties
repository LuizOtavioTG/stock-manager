spring.datasource.url=jdbc:h2:mem:stock_manager_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

spring.flyway.enabled=false

app.security.jwt.secret=stock-manager-test-secret-key-with-32-chars
app.security.jwt.access-token-expiration=15m
app.security.jwt.refresh-token-expiration=7d
app.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=*
