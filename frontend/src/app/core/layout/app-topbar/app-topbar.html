<header class="layout-topbar">
  <div class="layout-topbar-logo-container">
    <button class="layout-menu-button layout-topbar-action" type="button" aria-label="Alternar menu" (click)="toggleMenu()">
      <i class="pi pi-bars"></i>
    </button>

    <a class="layout-topbar-logo" routerLink="/dashboard" aria-label="Stock Manager">
      <span class="layout-topbar-logo-mark pi pi-box"></span>
      <span>Stock Manager</span>
    </a>
  </div>

  <div class="layout-topbar-actions" aria-label="Ações do sistema">
    <button class="layout-topbar-action" type="button" aria-label="Pesquisar">
      <i class="pi pi-search"></i>
      <span>Pesquisar</span>
    </button>
    <button class="layout-topbar-action" type="button" aria-label="Notificações">
      <i class="pi pi-bell"></i>
      <span>Notificações</span>
    </button>
    <button class="layout-topbar-action" type="button" aria-label="Perfil">
      <i class="pi pi-user"></i>
      <span>Perfil</span>
    </button>
  </div>
</header>
